# mihomo для Netcraze/Keenetic: перехват устройств политики «Mihomo», карточки сервисов, «Авто», YouTube через zapret.
# Серверы - файл servers.txt (ссылки vless://). Ставится router/install.sh.
mixed-port: 7890
redir-port: 7892
tproxy-port: 7893
allow-lan: true
bind-address: "*"
mode: rule
log-level: info
ipv6: false
unified-delay: true
tcp-concurrent: true
geodata-loader: memconservative
external-controller: 0.0.0.0:9090
external-ui: ui
# панель zashboard (без этой строки mihomo при обновлении панели скачивает MetaCubeXD)
external-ui-url: "https://github.com/Zephyruso/zashboard/releases/latest/download/dist.zip"
secret: "<MIHOMO_SECRET>"
profile: {store-selected: true}
geodata-mode: true
geox-url:
  geoip: "https://cdn.jsdelivr.net/gh/runetfreedom/russia-v2ray-rules-dat@release/geoip.dat"
  geosite: "https://cdn.jsdelivr.net/gh/runetfreedom/russia-v2ray-rules-dat@release/geosite.dat"
geo-auto-update: true
geo-update-interval: 24
tun: {enable: false}
sniffer:
  enable: true
  override-destination: true
  sniff:
    TLS: {ports: [443, 8443]}
    HTTP: {ports: [80, 8080-8880]}
    QUIC: {ports: [443]}
dns:
  enable: true
  listen: 0.0.0.0:7874
  ipv6: false
  # redir-host: устройствам отдаются настоящие адреса (UDP, звонки, игры работают как обычно), а mihomo помнит домен
  enhanced-mode: redir-host
  # резолвер AntiZapret через ваш сервер (группа "Авто"), туннель Кинетика не нужен; для заблокированного - 198.18.x
  default-nameserver: [62.76.76.62, 62.76.62.76]
  nameserver: ["1.1.1.1#Авто — самый быстрый"]
  proxy-server-nameserver: [62.76.76.62, 62.76.62.76]
  nameserver-policy:
    "+.ru,+.su,+.рф,geosite:category-ru,geosite:ru-available-only-inside": [62.76.76.62, 62.76.62.76, 77.88.8.8]
    # YouTube - настоящие адреса у MSK-IX: он идёт напрямую через zapret на роутере
    "+.youtube.com,+.googlevideo.com,+.ytimg.com,+.ggpht.com,+.youtu.be,+.youtube-nocookie.com,+.youtubekids.com,+.google.ru": [62.76.76.62, 62.76.62.76]
proxy-providers:
  # ваши серверы: по одной ссылке vless:// в строке (их печатает server/install-reality.sh)
  servers:
    type: file
    path: ./servers.txt
    health-check: {enable: true, url: "http://www.gstatic.com/generate_204", interval: 600}
proxies:
  - {"name": "Напрямую (провайдер)", "type": "direct"}
  - {"name": "Zapret — напрямую", "type": "direct"}
proxy-groups:
  - {"name": "Все серверы — проверка", "type": "select", "proxies": ["Напрямую (провайдер)", "Zapret — напрямую"], "icon": "https://cdn.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/Speedtest.png", "use": ["servers"]}
  - {"name": "Авто — самый быстрый", "type": "url-test", "use": ["servers"], "url": "http://www.gstatic.com/generate_204", "interval": 300, "tolerance": 25, "lazy": false, "icon": "https://cdn.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/Auto.png", "max-failed-times": 2}
  - {"name": "Заблокированное в РФ", "type": "select", "proxies": ["Авто — самый быстрый", "Напрямую (провайдер)"], "icon": "https://cdn.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/Russia.png", "use": ["servers"]}
  - {"name": "YouTube", "type": "select", "proxies": ["Zapret — напрямую", "Авто — самый быстрый", "Напрямую (провайдер)"], "icon": "https://cdn.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/YouTube.png", "use": ["servers"]}
  - {"name": "Telegram", "type": "select", "proxies": ["Авто — самый быстрый", "Напрямую (провайдер)"], "icon": "https://cdn.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/Telegram.png", "use": ["servers"]}
