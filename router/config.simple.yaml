rule-providers:
  my-block:
    type: file
    behavior: domain
    format: text
    path: ./providers/my-block.txt
  my-block-ips:
    type: file
    behavior: ipcidr
    format: text
    path: ./providers/my-block-ips.txt
  my-direct:
    type: file
    behavior: domain
    format: text
    path: ./providers/my-direct.txt
  my-direct-ips:
    type: file
    behavior: ipcidr
    format: text
    path: ./providers/my-direct-ips.txt
  my-vpn:
    type: file
    behavior: domain
    format: text
    path: ./providers/my-vpn.txt
  my-vpn-ips:
    type: file
    behavior: ipcidr
    format: text
    path: ./providers/my-vpn-ips.txt
  # ваши списки AntiZapret из панели (DE3 собирает каждые 30 мин), обновляются сами
  ru-blocked:
    type: http
    behavior: classical
    format: text
    url: "https://raw.githubusercontent.com/itdoginfo/allow-domains/main/Russia/inside-clashx.lst"
    path: ./providers/ru-blocked.lst
    interval: 43200
  rcv-category-ru:
    type: http
    behavior: domain
    format: mrs
    url: "https://cdn.jsdelivr.net/gh/hydraponique/roscomvpn-geosite/release/mihomo/category-ru.mrs"
    path: ./ruleset/category-ru.mrs
    interval: 86400
  rcv-whitelist:
    type: http
    behavior: domain
    format: mrs
    url: "https://cdn.jsdelivr.net/gh/hydraponique/roscomvpn-geosite/release/mihomo/whitelist.mrs"
    path: ./ruleset/whitelist.mrs
    interval: 86400
  rcv-direct-ips:
    type: http
    behavior: ipcidr
    format: mrs
    url: "https://cdn.jsdelivr.net/gh/hydraponique/roscomvpn-geoip/release/mihomo/direct.mrs"
    path: ./ruleset/direct-ips.mrs
    interval: 86400
  rcv-ru-apps:
    type: http
    behavior: classical
    format: yaml
    url: "https://raw.githubusercontent.com/roscomvpn/custom-category/release/mihomo/ru-apps.yaml"
    path: ./ruleset/ru-apps.yaml
    interval: 86400
